<div class="login-page">

  <div class="login-card">

    <div class="logo">
      🔐
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your account
    </p>

    <form (ngSubmit)="login()">



      <div class="form-group">

        <label for="email">
          Email
        </label>

       <input
  id="email"
  type="email"
  name="email"
  [(ngModel)]="email"
  placeholder="Enter your email"
  required
/>

      </div>



      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
  id="password"
  type="password"
  name="password"
  [(ngModel)]="password"
  placeholder="Enter your password"
  required
/>

      </div>


      <div class="login-options">

        <label class="remember">

          <input
            type="checkbox"
          />

          Remember me

        </label>

        <a routerLink="/register">
  Create Account
</a>

      </div>
   @if (errorMessage) {

  <div class="error-message">

    {{ errorMessage }}

  </div>

}


      <button
        type="submit"
        class="login-btn"
      >
        Sign In
      </button>

    </form>


    <p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Create Account
      </a>

    </p>

  </div>

</div>
