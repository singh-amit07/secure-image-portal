<div class="register-page">

  <div class="register-card">

    <div class="logo">
      👤
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your account to get started
    </p>



    @if (message) {
      <div class="success-message">
        {{ message }}
      </div>
    }


    @if (error) {
      <div class="error-message">
        {{ error }}
      </div>
    }


    <form (ngSubmit)="register()">


      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your full name"
          required
        />

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>



      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          required
        />

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your password"
          required
        />

      </div>



      <button
        type="submit"
        class="register-btn">

        Create Account

      </button>

    </form>


    <p class="login-text">

      Already have an account?

      <a routerLink="/login">
        Sign In
      </a>

    </p>

  </div>

</div>
